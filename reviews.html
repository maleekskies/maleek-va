<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta property="og:type" content="website">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Client Reviews | Malik Adesiyan">
<meta name="twitter:description" content="Client feedback and reviews for Malik Adesiyan's property management and virtual assistant work.">
<meta name="twitter:image" content="https://maleekVA.vercel.app/assets/headshot-01.jpg">
<link rel="icon" type="image/png" sizes="512x512" href="assets/favicon-512.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="shortcut icon" href="assets/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,600&family=Lora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F2E7; --bg-alt:#EFE8D8; --card:#FFFFFF; --text:#181818; --text-soft:#5c584f;
    --border:#18181815; --frame:#1F4A3D; --frame-tint:#1F4A3D14; --orange:#C1440E; --orange-dark:#a3390b;
  }
  html[data-theme="dark"]{
    --bg:#0C1917; --bg-alt:#122420; --card:#15302A; --text:#F5F0E4; --text-soft:#b7ad9c;
    --border:#f5f0e414; --frame:#2F6350; --frame-tint:#2F635033; --orange:#C1440E; --orange-dark:#d95a24;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }
  }
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Lora',serif; line-height:1.65;
    opacity:0; animation: pageIn 0.35s ease forwards;
    transition: background 0.2s ease, color 0.2s ease;
  }
  @keyframes pageIn{ from{opacity:0;} to{opacity:1;} }
  a{ color:inherit; }
  .wrap{ max-width:1120px; margin:0 auto; padding:0 32px; }
  @media (max-width:600px){ .wrap{ padding:0 22px; } }
  h1,h2{ margin:0; font-family:'Playfair Display',serif; }
  p{ margin:0; }

  .site-nav{ position:sticky; top:0; z-index:100; background:var(--bg); border-bottom:1px solid var(--border); }
  .site-nav-inner{ display:flex; align-items:center; justify-content:space-between; gap:20px; padding-top:18px; padding-bottom:18px; }
  .brand{ font-family:'Playfair Display',serif; font-style:italic; font-weight:600; color:var(--text); text-decoration:none; font-size:1.4rem; }
  .nav-links{ display:flex; gap:8px; list-style:none; margin:0; padding:0; }
  .nav-links a{ color:var(--text-soft); text-decoration:none; padding:8px 14px; border-radius:8px; transition:all 0.15s; font-size:0.95rem; }
  .nav-links a:hover{ color:var(--text); background:var(--bg-alt); }
  @media (max-width:760px){ .nav-links{ display:none; } }
  .nav-actions{ display:flex; align-items:center; gap:10px; }
  .icon-btn{ width:42px; height:42px; border-radius:10px; border:1px solid var(--border); background:transparent; color:var(--text); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all 0.15s; flex-shrink:0; }
  .icon-btn:hover{ background:var(--bg-alt); }
  .icon-btn svg{ width:19px; height:19px; }
  .cv-btn{ display:flex; align-items:center; gap:8px; background:var(--frame); color:#F5F0E4; border-radius:10px; padding:10px 16px; text-decoration:none; font-size:0.86rem; font-weight:600; transition:background 0.15s; white-space:nowrap; }
  .cv-btn:hover{ background:var(--orange); }
  .cv-btn svg{ width:16px; height:16px; }
  @media (max-width:520px){ .cv-btn span{ display:none; } }

  section{ padding:80px 0; }
  .page-hero{ padding:64px 0 46px; }
  .page-hero h1{ font-size:clamp(2rem,4.6vw,2.7rem); font-weight:700; margin-bottom:16px; }
  .page-hero p{ color:var(--text-soft); max-width:60ch; font-size:1.02rem; }
  .section-head{ max-width:720px; margin:0 auto 46px; }
  .section-head h2{ font-size:1.8rem; font-weight:700; }

  .review-card{
    background:var(--card); border:1px solid var(--border); border-radius:20px;
    overflow:hidden; display:grid; grid-template-columns:260px 1fr; margin-bottom:28px; transition:all 0.25s ease;
  }
  .review-card:hover{ transform:translateY(-5px); border-color:var(--frame); }
  @media (max-width:700px){ .review-card{ grid-template-columns:1fr; } }
  .review-img{ background:var(--frame); }
  .review-img img{ width:100%; height:100%; object-fit:cover; display:block; max-height:420px; }
  .review-body{ padding:30px; display:flex; flex-direction:column; justify-content:space-between; }
  .review-body blockquote{ font-family:'Playfair Display',serif; font-style:italic; font-size:1.1rem; margin:0 0 20px; }
  .review-meta{ font-size:0.82rem; color:var(--text-soft); border-top:1px solid var(--border); padding-top:14px; }
  .review-meta .row{ margin-bottom:4px; }
  .review-meta .k{ color:var(--orange); font-weight:700; }

  .placeholder-note{ text-align:center; color:var(--text-soft); font-size:0.9rem; border:1px dashed var(--border); border-radius:16px; padding:26px; }

  footer.site-footer{ background:var(--frame); color:#F5F0E4; padding:34px 0; text-align:center; font-size:0.85rem; }

  .reveal{ opacity:0; transform:translateY(14px); transition:opacity 0.5s ease, transform 0.5s ease; }
  .reveal.in-view{ opacity:1; transform:translateY(0); }


  .hamburger-btn{ display:none; }
  @media (max-width:760px){ .hamburger-btn{ display:flex; } }
  .mobile-menu{
    display:none; position:absolute; top:100%; left:0; right:0;
    background:var(--bg); border-bottom:1px solid var(--border);
    padding:6px 0;
  }
  .mobile-menu.open{ display:block; }
  .mobile-menu a{
    display:block; padding:14px 32px; color:var(--text); text-decoration:none;
    font-size:1rem; border-top:1px solid var(--border);
  }
  .mobile-menu a:first-child{ border-top:none; }
  .mobile-menu a:hover{ background:var(--bg-alt); }

  @media print{
    body{ background:#fff; color:#000; opacity:1; animation:none; }
    .site-nav, footer.site-footer{ display:none; }
  }
</style>
</head>
<body>

<header class="site-nav">
  <div class="wrap site-nav-inner">
    <a class="brand" href="index.html">Malik.</a>
    <nav class="nav-links">
      <a href="index.html#about">About</a>
      <a href="index.html#work">Work</a>
      <a href="reviews.html">Reviews</a>
      <a href="index.html#contact">Contact</a>
    </nav>
    <div class="nav-actions">
      <button class="icon-btn" id="theme-toggle" aria-label="Toggle dark mode" type="button">
        <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
      </button>
      <button class="icon-btn hamburger-btn" id="hamburger-btn" aria-label="Menu" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
    </div>
  </div>
  <nav class="mobile-menu" id="mobile-menu">
    <a href="index.html#about">About</a>
    <a href="index.html#work">Work</a>
    <a href="reviews.html">Reviews</a>
    <a href="index.html#contact">Contact</a>
  </nav>
</header>

<section class="page-hero">
  <div class="wrap">
    <h1>Reviews</h1>
    <p>Unedited messages and notes from landlords and property owners I've worked with directly.</p>
  </div>
</section>

<section>
  <div class="wrap">
    <div class="section-head reveal"><h2>All reviews</h2></div>
    <div id="reviews-list"></div>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">Malik Adesiyan, Operations &amp; Property Management Virtual Assistant</div>
</footer>

<script>
(function(){
  var root = document.documentElement;
  var stored = localStorage.getItem('theme');
  var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  var theme = stored || (prefersDark ? 'dark' : 'light');
  if (theme === 'dark') root.setAttribute('data-theme', 'dark');

  var toggle = document.getElementById('theme-toggle');
  var icon = document.getElementById('theme-icon');
  function setIcon(t){
    if (t === 'dark'){
      icon.innerHTML = '<path d="M21 12.5A9 9 0 1111.5 3a7 7 0 009.5 9.5z"/>';
    } else {
      icon.innerHTML = '<circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>';
    }
  }
  setIcon(theme);
  toggle.addEventListener('click', function(){
    var isDark = root.getAttribute('data-theme') === 'dark';
    var next = isDark ? 'light' : 'dark';
    if (next === 'dark') root.setAttribute('data-theme','dark'); else root.removeAttribute('data-theme');
    localStorage.setItem('theme', next);
    setIcon(next);
  });

  var hamburger = document.getElementById('hamburger-btn');
  var mobileMenu = document.getElementById('mobile-menu');
  if (hamburger && mobileMenu) {
    hamburger.addEventListener('click', function(e){
      e.stopPropagation();
      mobileMenu.classList.toggle('open');
    });
    mobileMenu.querySelectorAll('a').forEach(function(a){
      a.addEventListener('click', function(){ mobileMenu.classList.remove('open'); });
    });
    document.addEventListener('click', function(e){
      if (!mobileMenu.contains(e.target) && !hamburger.contains(e.target)) {
        mobileMenu.classList.remove('open');
      }
    });
  }

    window.addEventListener('pageshow', function(e){
    if (e.persisted) {
      document.body.style.transition = 'none';
      document.body.style.animation = 'none';
      document.body.style.opacity = '1';
    }
  });

  function escapeHtml(str){
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /* To add a new review: drop the image in assets/, then add one entry
     to this array. No other markup needs to change. */
  var REVIEWS = [
    {
      tag: "Review 1",
      img: "assets/exhibit-01.jpeg",
      alt: "WhatsApp message from a UK Property Management group thanking Wummie for her dedication",
      quote: "Thank you so much for going out of your way and working outside of your normal hours to sort the tenant out. Your dedication and willingness to step in when needed is truly appreciated. Thanks again for your hard work and support.",
      source: "UK Property Management group chat",
      from: "Property owner (\u201cGrandma Genus\u201d)"
    }
  ];

  var container = document.getElementById('reviews-list');
  REVIEWS.forEach(function(r){
    var el = document.createElement('div');
    el.className = 'review-card reveal';
    el.innerHTML =
      '<div class="review-img"><img src="' + escapeHtml(r.img) + '" alt="' + escapeHtml(r.alt) + '"></div>' +
      '<div class="review-body">' +
        '<blockquote>\u201c' + escapeHtml(r.quote) + '\u201d</blockquote>' +
        '<div class="review-meta">' +
          '<div class="row"><span class="k">Source:</span> ' + escapeHtml(r.source) + '</div>' +
          '<div class="row"><span class="k">From:</span> ' + escapeHtml(r.from) + '</div>' +
        '</div>' +
      '</div>';
    container.appendChild(el);
  });
  var note = document.createElement('div');
  note.className = 'placeholder-note';
  note.textContent = 'More reviews coming soon.';
  container.appendChild(note);

  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if (entry.isIntersecting){
          entry.target.classList.add('in-view');
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15 });
    document.querySelectorAll('.reveal').forEach(function(el){ io.observe(el); });
  }

  document.querySelectorAll('a[href]').forEach(function(link){
    var href = link.getAttribute('href');
    if (!href || href.charAt(0) === '#' || link.target === '_blank') return;
    if (href.indexOf('mailto:') === 0 || href.indexOf('http') === 0) return;
    link.addEventListener('click', function(e){
      e.preventDefault();
      document.body.style.animation = 'none';
      document.body.style.transition = 'opacity 0.2s ease';
      document.body.style.opacity = '0';
      setTimeout(function(){ window.location.href = href; }, 200);
    });
  });
})();
</script>

</body>
</html>
